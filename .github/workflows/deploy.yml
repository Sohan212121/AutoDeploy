name: "AutoDeploy CI/CD"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: "1.0.0"

concurrency:
  group: "autodeploy-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    name: "Run Automated Test Suite"
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.13 environment with dependency caching
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Step 3: Install project dependencies pinned in requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run pytest test suite in verbose mode
      - name: Run unit and integration tests
        run: pytest -v

  build-and-push:
    name: "Build Container & Push to GHCR"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Compute lowercase GHCR image name and ISO UTC build timestamp
      - name: Configure environment variables for GHCR image and timestamp
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      # Step 3: Set up Docker Buildx for multi-platform builds and layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Build container image locally for verification and smoke testing
      - name: Build image for local smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: autodeploy:smoke
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 5: Launch container and verify /health and /version endpoints
      - name: Run container smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 autodeploy:smoke

          echo "Polling container health endpoint..."
          HEALTHY=0
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Smoke test passed on attempt $i (HTTP 200)"
              HEALTHY=1
              break
            fi
            echo "Attempt $i: HTTP status $HTTP_STATUS, sleeping 2s..."
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Error: Smoke test timed out waiting for /health (HTTP 200)!"
            echo "=== Smoke Container Logs ==="
            docker logs smoke
            exit 1
          fi

          echo "Verifying /version returns commit SHA..."
          VERSION_RESP=$(curl -s http://localhost:8000/version)
          echo "Response from /version: $VERSION_RESP"
          if ! echo "$VERSION_RESP" | grep -q "${{ github.sha }}"; then
            echo "Error: /version response does not contain commit SHA '${{ github.sha }}'"
            echo "=== Smoke Container Logs ==="
            docker logs smoke
            exit 1
          fi
          echo "Smoke test validated successfully!"

      # Step 6: Clean up the smoke test container whether tests passed or failed
      - name: Clean up smoke container
        if: always()
        run: docker rm -f smoke || true

      # Step 7: Authenticate Docker against GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 8: Build and push verified production image to GHCR reusing cache
      - name: Build and push production image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 9: Publish step summary to GitHub Actions execution view
      - name: Publish deployment summary
        run: |
          echo "### AutoDeploy Build & Push Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Application Version:** \`${{ env.APP_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Published Image (Latest):** \`${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Published Image (SHA):** \`${{ env.IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time (UTC):** \`${{ env.BUILD_TIME }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: "Deploy to Local Self-Hosted Runner"
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    concurrency:
      group: "autodeploy-deploy"
      cancel-in-progress: false
    steps:
      # Step 1: Check out repository to access deployment/deploy.ps1
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry via stdin (no secret echoed)
      - name: Log in to GHCR
        shell: powershell
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            $dockerBin = "C:\Users\sohan\AppData\Local\Programs\DockerDesktop\resources\bin"
            if (Test-Path $dockerBin) { $env:PATH += ";$dockerBin" }
          }
          $dataDir = Join-Path $env:USERPROFILE "autodeploy-data"
          if (-not (Test-Path $dataDir)) { New-Item -ItemType Directory -Path $dataDir -Force | Out-Null }
          $diagFile = Join-Path $dataDir "login_diag.log"

          $infoOut = docker info --format "{{.ServerVersion}}" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            [System.IO.File]::WriteAllText($diagFile, "docker info failed ($LASTEXITCODE): $infoOut")
            Write-Output "docker info failed: $infoOut"
            exit $LASTEXITCODE
          }

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Get-Command docker).Source
          $psi.Arguments = "login ghcr.io -u `"${{ github.actor }}`" --password-stdin"
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)
          $proc.StandardInput.Write($env:GHCR_TOKEN)
          $proc.StandardInput.Close()
          $stdout = $proc.StandardOutput.ReadToEnd()
          $stderr = $proc.StandardError.ReadToEnd()
          $proc.WaitForExit()
          $loginCode = $proc.ExitCode
          $loginOut = "$stdout`n$stderr".Trim()
          if ($loginCode -ne 0) {
            [System.IO.File]::WriteAllText($diagFile, "docker login failed ($loginCode): $loginOut")
            Write-Output $loginOut
            exit $loginCode
          }
          if (Test-Path $diagFile) { Remove-Item $diagFile -Force }
          Write-Output "GHCR login succeeded."

      # Step 3: Deploy container with verification and automatic rollback on failure
      - name: Run local deployment script
        shell: powershell
        env:
          SIMULATE_FAILURE: ${{ contains(github.event.head_commit.message, '[simulate-failure]') && 'true' || 'false' }}
        run: |
          $repoLower = "${{ github.repository }}".ToLower()
          $imageName = "ghcr.io/$repoLower"
          & .\deployment\deploy.ps1 -ImageName $imageName -Tag "${{ github.sha }}"
          exit $LASTEXITCODE

      # Step 4: Print last 20 history entries and write summary regardless of deploy outcome
      - name: Print deployment history and summary
        if: always()
        shell: powershell
        run: |
          $historyPath = Join-Path $env:USERPROFILE "autodeploy-data\deployment_history.json"
          if (Test-Path $historyPath) {
            $entries = @(Get-Content $historyPath -Raw | ConvertFrom-Json)
            $last20 = @($entries | Select-Object -Last 20)
            Write-Output "=== Last $($last20.Count) Deployment History Entries ==="
            ConvertTo-Json -InputObject $last20 -Depth 5 | Write-Output
          } else {
            Write-Output "No deployment history file found at $historyPath"
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Local Self-Hosted Deployment Summary" -Encoding UTF8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Commit SHA:** ``${{ github.sha }}``" -Encoding UTF8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Job Status:** ``${{ job.status }}``" -Encoding UTF8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **History File:** ``$historyPath``" -Encoding UTF8

