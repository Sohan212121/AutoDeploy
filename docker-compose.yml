services:
  autodeploy:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: autodeploy-app
    ports:
      - "8000:8000"
    environment:
      - DEPLOY_ENV=local
    restart: unless-stopped
    volumes:
      - autodeploy-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  autodeploy-data:

